name: CI — IFOG Virtual Prototype Verification

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Diff Filter — Run CI Only on Code Changes (Skip Docs-Only)
    runs-on: ubuntu-24.04
    outputs:
      code_changed: ${{ steps.diff.outputs.code_changed }}
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - name: Checkout repository (full history for git diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files via scripts/ci_diff_filter.py
        id: diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi
          python3 scripts/ci_diff_filter.py \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --github-output "${GITHUB_OUTPUT}" \
            --summary-out "${GITHUB_STEP_SUMMARY}"

  governance-and-spec-lock:
    name: Governance, Branch Policy & Quadruple Spec Immutability
    needs: detect-changes
    if: needs.detect-changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce Rule 1 — Strict 2-Branch Policy (only main and dev allowed)
        run: |
          set -euo pipefail
          EXTRA_BRANCHES=$(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
            | sed 's|^origin/||' \
            | grep -Ev '^(HEAD|main|dev)$' || true)
          if [ -n "$EXTRA_BRANCHES" ]; then
            echo "ERROR (AGENT.md Rule 1): Disallowed branches detected on origin:"
            echo "$EXTRA_BRANCHES"
            exit 1
          fi
          echo "Branch policy OK: only {main, dev} exist on origin."

      - name: Enforce Rule 1 — PR to main must originate strictly from dev
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if [ "${{ github.head_ref }}" != "dev" ] || [ "${{ github.base_ref }}" != "main" ]; then
            echo "ERROR (AGENT.md Rule 1): PRs must merge strictly dev -> main (got ${{ github.head_ref }} -> ${{ github.base_ref }})"
            exit 1
          fi
          echo "PR branch policy OK: dev -> main."

      - name: Enforce Rule 7 — Quadruple Spec SHA-256 Immutability & PDF Presence
        run: |
          set -euo pipefail
          sha256sum -c spec/IFOG-SIM-SPEC-004.sha256 spec/IFOG-SIM-SPEC-005.sha256 spec/IFOG-SIM-SPEC-006.sha256 spec/IFOG-SIM-SPEC-007.sha256
          test -s spec/IFOG-SIM-SPEC-004.pdf
          test -s spec/IFOG-SIM-SPEC-005.pdf
          test -s spec/IFOG-SIM-SPEC-006.pdf
          test -s spec/IFOG-SIM-SPEC-006.md
          test -s spec/IFOG-SIM-SPEC-007.pdf
          test -s spec/IFOG-SIM-SPEC-007.md
          echo "All four spec checksums (SPEC-004, SPEC-005, SPEC-006, SPEC-007) and compiled PDFs verified."

      - name: Enforce Rule 6 — Governance & Project Skills Presence
        run: |
          set -euo pipefail
          test -s AGENT.md
          test -s skills/README.md
          for skill in \
            ifog-spec-formula-verification \
            ifog-tier1-optical-thermal \
            ifog-tier2-sysc-ams-core \
            ifog-6state-and-scenarios \
            ifog-fmi3-cosim-fmu \
            ifog-spec007-physics-calibration \
            ifog-industrial-trl7-do254 \
            ifog-tier3-dual-regime-avar \
            ifog-reporting-and-doc-sync \
            ifog-portable-container-env \
            ifog-cicd-release-workflow; do
            test -s "skills/${skill}/SKILL.md"
          done
          echo "AGENT.md and all 11 project skills verified."

      - name: Enforce Rule 16 — Mandatory Version-Document Synchronization
        run: |
          set -euo pipefail
          python3 scripts/verify_doc_sync.py

  build-and-verify:
    name: Build SystemC-AMS & FMI 3.0.2 FMUs, 53 Formulas, 100% C++/Py Coverage & Full 29 Scenarios
    needs: governance-and-spec-lock
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SYSTEMC_AMS_HOME: ${{ github.workspace }}/.cache/systemc-ams
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system toolchain (SystemC 2.3.4, nlohmann-json, gcovr, autotools)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake autoconf automake libtool pkg-config \
            libsystemc-dev nlohmann-json3-dev gcovr lcov

      - name: Cache SystemC-AMS PoC 2.3.4 installation
        id: cache-scams
        uses: actions/cache@v4
        with:
          path: ${{ env.SYSTEMC_AMS_HOME }}
          key: systemc-ams-2.3.4-ubuntu2404-a72d365f

      - name: Build & install SystemC-AMS PoC 2.3.4 (if cache miss)
        if: steps.cache-scams.outputs.cache-hit != 'true'
        run: bash scripts/install_systemc_ams.sh

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies (with FMPy) & editable package
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install numpy scipy matplotlib plotly jsonschema fmpy pytest pytest-cov pytest-xdist
          python3 -m pip install -e . --no-build-isolation --no-deps

      - name: Build Tier 2 SystemC-AMS Core (-O3, -fPIC), Package Both FMI 3.0.2 FMUs & Run C++ Unit Tests
        run: |
          cmake -S tier2_sysc_ams -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          cmake --build build --target package_fmu package_fmu_multi
          ./build/ifog_cpp_tests
          ./build/ifog_fmi_multi_tests
          python3 -c "from fmpy.validation import validate_fmu; assert not validate_fmu('build/ifog_core.fmu'); assert not validate_fmu('build/ifog_core_multi.fmu'); print('Both FMI 3.0.2 FMUs validated cleanly!')"

      - name: Gate A — C++ 100.0% Line Coverage Verification (Tier 2 + fmi_wrapper, gcovr)
        run: bash scripts/run_cpp_coverage.sh

      - name: Gate B — Per-Formula Verification Matrix (EQ-01 .. EQ-53, Rule 3)
        run: |
          python3 scripts/verify_formulas_ci.py --out-dir data/ci_formula_report
          cat data/ci_formula_report/formula_verification_matrix.md

      - name: Gate C — Python Unit & Formula Suite with 100.0% Coverage (pytest-cov)
        run: |
          pytest tests/unit tests/formula_verification \
            --cov --cov-report=term-missing --cov-report=xml:data/python_coverage.xml

      - name: Gate D — Full Real 29-Item Suite (Gates 1-6 + Groups A-E incl. TRL 7-8 / DO-254)
        run: pytest tests/system -v -s

      - name: Upload CI Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ifog-ci-verification-artifacts
          path: |
            build/ifog_core.fmu
            build/ifog_core_multi.fmu
            data/ci_formula_report/formula_verification_matrix.md
            data/ci_formula_report/formula_verification_matrix.json
            data/cov_cpp_work/cpp_coverage_summary.json
            data/python_coverage.xml
          if-no-files-found: warn

  container-build-and-verify:
    name: Build OCI Containerfile (Git SystemC/SC-AMS + FMI 3.0 FMU) & Run Live In-Container Sim
    needs: governance-and-spec-lock
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Containerfile (with GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          load: true
          tags: ifog-vproto:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify live in-container simulation (Gate 5 6-State DSP & FMI 3.0 FMU) & auto-reporting
        run: |
          set -euo pipefail
          ./scripts/container_run.sh --engine docker --tag ifog-vproto:ci sim --mode dsp6_compare --run-id ci_container_dsp6
          test -s report/ci_container_dsp6/report.md
          test -s report/ci_container_dsp6/report.html
          test -s report/index.html
          docker run --rm ifog-vproto:ci python3 -c "from tier3_analysis.fmi_master_runner import validate_fmu_package; r = validate_fmu_package('build/ifog_core.fmu'); assert r['validation_pass'], r; print('In-container FMI 3.0 FMU validation PASSED!')"
          echo "Container build, live 6-State DSP auto-report & FMI 3.0 FMU check PASSED!"
